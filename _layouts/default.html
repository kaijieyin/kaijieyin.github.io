<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.name | escape }}</title>
  <meta name="author" content="{{ site.name | escape }}">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#111111">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.name | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:image" content="{{ site.avatar | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <!-- Use the browser's default icon, matching zechunliu.com. -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E00L9PT3V9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-E00L9PT3V9');
  </script>
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="container site-nav" aria-label="Main navigation">
      <a class="site-name" href="{{ '/' | relative_url }}">Kaijie Yin <span lang="zh">殷凯捷</span></a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}#about">About</a>
        <a href="{{ '/' | relative_url }}#research">Research</a>
        <a href="{{ '/' | relative_url }}#publications">Publications</a>
        <a href="{{ '/' | relative_url }}#affiliations">Affiliations</a>
      </div>
    </nav>
  </header>
  <main id="main" class="container page-content" tabindex="-1">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="container footer-content">
      <p>&copy; {{ site.time | date: '%Y' }} Kaijie Yin</p>
      <p>Design inspired by <a href="https://zechunliu.com/">Zechun Liu</a> and <a href="https://jonbarron.info/">Jon Barron</a>.</p>
      <a class="back-to-top" href="#top">Back to top &uarr;</a>
    </div>
  </footer>
</body>
</html>
